# qeet-id-website — repository context metadata (Level 2).
schema_version: 1
context: {type: repository, level: L2, canonical: true, last_verified: "2026-08-28"}
inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}
repository:
  name: qeet-id-website
  product: qeet-id
  type: frontend
  role: supporting
  status: active
  visibility: public
  default_branch: main
  working_branch: develop
  host: id.qeet.in
runtime:
  language: TypeScript
  framework: Next.js 16.2.6
  react: "^19.2.6"
  package_manager: bun@1.3.14
  design_system: "@qeetrix/ui ^1.0.2"   # npm latest is 2.0.0 — a major behind
  dev_port: 3001                         # by workspace convention; not configured in-repo
architecture:
  style: static-marketing-site
  backend_calls: none                    # VERIFIED — it never calls api.id.qeet.in
  route_group: "(marketing)"
  compare_pages: 19                      # README claims 4 — stale
  src: [src/app, src/components/marketing, src/lib]
contracts:
  consumes: {}                           # no API
  outbound_links:
    dashboard: {env: NEXT_PUBLIC_DASHBOARD_URL, default: https://console.id.qeet.in}
    docs:      {env: NEXT_PUBLIC_DOCS_URL,      default: https://docs.qeet.in}
  own_route: POST /api/contact           # the ONLY server code
commands:
  dev:   bun run dev
  build: bun run build
  test:  bun test                        # 1 test file
  lint:  bun run lint                    # biome
  check: bun run check
  typecheck: bun run typecheck
ci:
  workflows: [ci.yml, deploy.yml]
  verify: "ci.yml: typecheck -> biome check -> bun test -> build (develop, release/**, PRs)"
  image: "ci.yml `image` on release/**: ghcr.io/qeetgroup/qeet-id-website:sha-<commit> for the qeet-id-deploy test kit"
  runner: ubuntu-latest
  deploy: push main -> gate -> vercel build/deploy --prod -> tag vX.Y.Z + GitHub release
container:
  dockerfile: Dockerfile                 # test kit only; production stays on Vercel
  port: 3000
  health: GET /healthz
  runtime_env: [CONSOLE_URL, DOCS_URL]   # /go/console|docs/... redirects (src/lib/go.ts); not secrets
  build_env: "NEXT_OUTPUT=standalone, NEXT_PUBLIC_DASHBOARD_URL=/go/console, NEXT_PUBLIC_DOCS_URL=/go/docs"
security:
  no_auth: true
  no_secrets: true                       # NEXT_PUBLIC_* inlined at build; container: CONSOLE_URL/DOCS_URL (public URLs)
  finding: "POST /api/contact has no rate limiting, captcha, or origin check"
llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
